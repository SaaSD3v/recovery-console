name: Recovery Console CI
run-name: ${{ github.event.head_commit.message || format('Release {0}', github.event.inputs.tag_name) || github.workflow }}

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create an Official GitHub Release?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Tag name (Only used if Release is checked)'
        required: false
        default: 'test'

jobs:
  build:
    name: Build Recovery Console
    runs-on: ubuntu-latest
    environment: "gofile keys"
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential wget tree xxd

    - name: Download Toolchains
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        BASE_URL="https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers"

        echo "[*] Downloading aarch64 toolchain..."
        wget -q $BASE_URL/aarch64-linux-musl-cross.tar.gz

        echo "[*] Downloading armhf toolchain..."
        wget -q $BASE_URL/arm-linux-musleabihf-cross.tar.gz

        echo "[*] Downloading x86 toolchain..."
        wget -q $BASE_URL/i686-linux-musl-cross.tar.gz

        echo "[*] Downloading x86_64 toolchain..."
        wget -q $BASE_URL/x86_64-linux-musl-cross.tar.gz

        echo "[*] Extracting toolchains..."
        for f in *.tar.gz; do
          echo "Extracting $f..."
          tar -xzf "$f"
        done

        echo "[+] Toolchains ready."
        tree -L 3 $HOME/toolchains

    - name: Build Dependencies
      run: make build-deps

    - name: Build All Tarball
      run: make all-tarball

    - name: Stage & Rename Artifacts
      run: |
        TAR_NAME=$(ls recovery-console-v*-*.tar.gz)
        mkdir -p dist
        mv ${TAR_NAME} dist/
        echo "TAR_FILE=dist/${TAR_NAME}" >> $GITHUB_ENV

    - name: Upload Final Artifacts (Tarball)
      uses: actions/upload-artifact@v4
      with:
        name: recovery-console-artifacts
        path: dist/

    - name: Prepare uncompressed files for GoFile
      shell: bash
      run: |
        set -euo pipefail
        rm -rf gofile-files
        mkdir -p gofile-files
        tar -xzf "$TAR_FILE" -C gofile-files
        find gofile-files -type f -print | sort
    - name: Upload individual files to GoFile
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      env:
        GOFILE_TOKEN: ${{ secrets.GOFILE }}
        GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID || vars.GOFILE_FOLDER_ID }}
        GOFILE_SOURCE: gofile-files
      run: |
        set -euo pipefail
        if [ -z "${GOFILE_TOKEN:-}" ]; then
          echo "::error::GoFile token not found. Supported names: GOFILE_TOKEN, GOFILE_API_TOKEN, GOFILE_API_KEY, GOFILE_API, GOFILE_KEY, GOFILE or API_GOFILE."
          exit 1
        fi
        test -d "$GOFILE_SOURCE"
        folder_id="${GOFILE_FOLDER_ID:-}"
        folder_page=""
        uploaded=0
        summary="$RUNNER_TEMP/gofile-files.md"
        : > "$summary"
        while IFS= read -r -d '' file; do
          args=(--silent --show-error --fail-with-body --retry 4 --retry-delay 2 --retry-all-errors
            -H "Authorization: Bearer $GOFILE_TOKEN"
            -F "file=@$file")
          if [ -n "$folder_id" ]; then
            args+=(-F "folderId=$folder_id")
          fi
          response="$(curl "${args[@]}" https://upload.gofile.io/uploadfile)"
          mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder","")); print(d.get("downloadPage","")); print(d.get("parentFolderCode",""))')
          status="${meta[0]:-}"
          parent="${meta[1]:-}"
          page="${meta[2]:-}"
          parent_code="${meta[3]:-}"
          if [ "$status" != "ok" ]; then
            echo "::error::GoFile rejected $(basename "$file")"
            printf '%s\n' "$response" >&2
            exit 1
          fi
          if [ -z "$folder_id" ]; then folder_id="$parent"; fi
          if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
          name="$(basename "$file")"
          if [ -n "$page" ]; then
            printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"
          else
            printf -- '- %s\n' "$name" >> "$summary"
          fi
          uploaded=$((uploaded + 1))
        done < <(find "$GOFILE_SOURCE" -type f -print0 | sort -z)
        if [ "$uploaded" -eq 0 ]; then
          echo "::error::No files found in $GOFILE_SOURCE for GoFile upload"
          exit 1
        fi
        {
          echo "### GoFile — $uploaded individual files"
          [ -z "$folder_page" ] || echo "Folder: $folder_page"
          echo
          cat "$summary"
        } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: [build]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.create_release == 'true' &&
      github.event.inputs.tag_name != '' &&
      github.event.inputs.tag_name != 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Generate Changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "Previous tag: $PREV_TAG"

        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --oneline --pretty=format:"* %s (%h)")
        else
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --pretty=format:"* %s (%h)")
        fi

        {
          echo "notes<<EOF"
          echo "$CHANGELOG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        name: Recovery Console ${{ github.event.inputs.tag_name || 'Development Build' }}
        target_commitish: ${{ github.sha }}
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.notes }}

          ---
          **Automated Release by Recovery Console CI**
        files: |
          release-assets/*.tar.gz
