name: Channel Binary CI

on:
  push:
    branches: ["Channel-Configs"]
    paths:
      - "Makefile"
      - "*.c"
      - "include/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Channel aarch64 - ${{ matrix.orientation }}
    runs-on: ubuntu-latest
    environment: "gofile keys"
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotation: 0
            degrees: 0deg
            orientation: portrait-0
          - rotation: 1
            degrees: 90deg
            orientation: landscape-90
          - rotation: 2
            degrees: 180deg
            orientation: portrait-180
          - rotation: 3
            degrees: 270deg
            orientation: landscape-270

    steps:
      - uses: actions/checkout@v4

      - name: Select Channel rotation
        run: |
          set -euxo pipefail
          sed -i "s/^#define CHANNEL_ROTATION 0$/#define CHANNEL_ROTATION ${{ matrix.rotation }}/" include/config.h
          grep -E '^#define (CHANNEL_ROTATION|ROTATION)' include/config.h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file xxd

      - name: Download aarch64 musl toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          curl -fL --retry 3 --retry-delay 2             -o aarch64-linux-musl-cross.tar.gz             "https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers/aarch64-linux-musl-cross.tar.gz"
          tar -xzf aarch64-linux-musl-cross.tar.gz
          "$HOME/toolchains/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc" --version

      - name: Build FreeType
        run: ./scripts/build-freetype.sh aarch64-linux-musl

      - name: Build static Recovery Console
        run: |
          set -euxo pipefail
          make clean
          make aarch64 V=1
          BIN=output/recovery-console-aarch64
          test -s "$BIN"
          file "$BIN"
          file "$BIN" | grep -Eq 'ELF 64-bit.*(ARM aarch64|AArch64)'
          if readelf -l "$BIN" | grep -q 'Requesting program interpreter'; then
            echo "ERROR: Channel binary must be static" >&2
            exit 1
          fi
          sha256sum "$BIN"

      - name: Package binary
        run: |
          set -euxo pipefail
          mkdir -p dist package
          NAME="recovery-console-channel-aarch64-${{ matrix.orientation }}"
          cp output/recovery-console-aarch64 "package/$NAME"
          cat > package/BUILD-INFO.txt <<EOF
          Device: Motorola Moto G7 Play (channel)
          Branch: Channel-Configs
          Artifact type: standalone Recovery Console binary
          Architecture: aarch64
          Backend: Qualcomm MDSS FBDEV
          Framebuffer: /dev/graphics/fb0
          Physical display: 720x1512
          Rotation: ${{ matrix.rotation }}
          Orientation: ${{ matrix.orientation }}
          Recovery image included: NO
          EOF
          tar -czf "dist/${NAME}.tar.gz" -C package "$NAME" BUILD-INFO.txt
          sha256sum "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"

      - name: Upload normal binary
        uses: actions/upload-artifact@v4
        with:
          name: recovery-console-channel-aarch64-${{ matrix.orientation }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Prepare separate binary files for GoFile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gofile-files
          mkdir -p gofile-files
          bin="$(find package -maxdepth 1 -type f -name 'recovery-console-*' | head -n1)"
          test -n "$bin"
          cp "$bin" gofile-files/
          cp package/BUILD-INFO.txt "gofile-files/BUILD-INFO-${{ matrix.orientation }}.txt"
          sha256sum "gofile-files/$(basename "$bin")" > "gofile-files/$(basename "$bin").sha256"
      - name: Upload individual files to GoFile
        shell: bash
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN || secrets.GOFILE_API_TOKEN || secrets.GOFILE_API_KEY || secrets.GOFILE_API || secrets.GOFILE_KEY || secrets.GOFILE || secrets.API_GOFILE || vars.GOFILE_TOKEN || vars.GOFILE_API_TOKEN || vars.GOFILE_API_KEY || vars.GOFILE_API || vars.GOFILE_KEY || vars.GOFILE || vars.API_GOFILE }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID || vars.GOFILE_FOLDER_ID }}
          GOFILE_SOURCE: gofile-files
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::error::GoFile token not found. Supported names: GOFILE_TOKEN, GOFILE_API_TOKEN, GOFILE_API_KEY, GOFILE_API, GOFILE_KEY, GOFILE or API_GOFILE."
            exit 1
          fi
          test -d "$GOFILE_SOURCE"
          folder_id="${GOFILE_FOLDER_ID:-}"
          folder_page=""
          uploaded=0
          summary="$RUNNER_TEMP/gofile-files.md"
          : > "$summary"
          while IFS= read -r -d '' file; do
            args=(--silent --show-error --fail-with-body --retry 4 --retry-delay 2 --retry-all-errors
              -H "Authorization: Bearer $GOFILE_TOKEN"
              -F "file=@$file")
            if [ -n "$folder_id" ]; then
              args+=(-F "folderId=$folder_id")
            fi
            response="$(curl "${args[@]}" https://upload.gofile.io/uploadfile)"
            mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder","")); print(d.get("downloadPage","")); print(d.get("parentFolderCode",""))')
            status="${meta[0]:-}"
            parent="${meta[1]:-}"
            page="${meta[2]:-}"
            parent_code="${meta[3]:-}"
            if [ "$status" != "ok" ]; then
              echo "::error::GoFile rejected $(basename "$file")"
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if [ -z "$folder_id" ]; then folder_id="$parent"; fi
            if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
            name="$(basename "$file")"
            if [ -n "$page" ]; then
              printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"
            else
              printf -- '- %s\n' "$name" >> "$summary"
            fi
            uploaded=$((uploaded + 1))
          done < <(find "$GOFILE_SOURCE" -type f -print0 | sort -z)
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No files found in $GOFILE_SOURCE for GoFile upload"
            exit 1
          fi
          {
            echo "### GoFile — $uploaded individual files"
            [ -z "$folder_page" ] || echo "Folder: $folder_page"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
