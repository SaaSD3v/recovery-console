name: Albus Recovery Image Builder

on:
  push:
    branches: ["Albus-Recovery-Image-Builder"]
    paths:
      - "builder/REQUEST.env"
      - "builder/integrate-recovery.sh"
      - "builder/set-albus-rotation.py"
      - "builder/build-freetype.sh"
      - ".github/workflows/recovery-image-builder.yml"

permissions:
  contents: read

env:
  ALBUS_BASE_BUILDER_COMMIT: "a567dec13ee75bb50b0640525b20b5fc22ff6eac"
  ALBUS_KERNEL_COMMIT: "9a7416218ae637c4120c417b31428bb0747fdfdf"
  ALBUS_TWRP_FILE: "twrp-3.5.0_9-0-albus.img"
  ALBUS_TWRP_SHA256: "4c42bfee165ea99e2663284a3634135786e157bd6cc492fcbe0d9bd3430e9261"
  ALBUS_RECOVERY_LIMIT: "21073920"
  MAGISK_VERSION: "30.7"
  MAGISK_APK_SHA256: "e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5"
  MAGISKBOOT_SHA256: "a18ecbd7981179494b7d281453d6c4e25b5c719e7d2ef7f6eba3c6be3043c58e"

jobs:
  prepare:
    name: Read Albus request
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
      source_ref: ${{ steps.cfg.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve request
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          test -f builder/REQUEST.env
          set -a
          source builder/REQUEST.env
          set +a

          : "${SOURCE_REF:=Albus-Configs}"
          : "${ORIENTATION:=all}"

          [ "$SOURCE_REF" = "Albus-Configs" ] || {
            echo "ERROR: Albus recovery builder only accepts SOURCE_REF=Albus-Configs" >&2
            exit 1
          }

          case "$ORIENTATION" in
            all)
              MATRIX='{"include":[
                {"rotation":0,"degrees":"0deg","orientation":"portrait-0"},
                {"rotation":1,"degrees":"90deg","orientation":"landscape-90"},
                {"rotation":2,"degrees":"180deg","orientation":"portrait-180"},
                {"rotation":3,"degrees":"270deg","orientation":"landscape-270"}
              ]}'
              ;;
            portrait-0)
              MATRIX='{"include":[{"rotation":0,"degrees":"0deg","orientation":"portrait-0"}]}'
              ;;
            landscape-90)
              MATRIX='{"include":[{"rotation":1,"degrees":"90deg","orientation":"landscape-90"}]}'
              ;;
            portrait-180)
              MATRIX='{"include":[{"rotation":2,"degrees":"180deg","orientation":"portrait-180"}]}'
              ;;
            landscape-270)
              MATRIX='{"include":[{"rotation":3,"degrees":"270deg","orientation":"landscape-270"}]}'
              ;;
            *)
              echo "ERROR: unsupported ORIENTATION=$ORIENTATION" >&2
              exit 1
              ;;
          esac

          MATRIX=$(printf '%s' "$MATRIX" | tr -d '\n' | tr -d ' ')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

  base:
    name: Build known-good Albus base
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout known-good Albus builder snapshot
        uses: actions/checkout@v4
        with:
          repository: SaaSD3v/albus-builder
          ref: ${{ env.ALBUS_BASE_BUILDER_COMMIT }}
          path: albus-base

      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes             bc binutils bison build-essential curl file flex git             libelf-dev libssl-dev lzma python-is-python3 unzip xxd xz-utils

      - name: Build exact known-good kernel and TWRP base
        shell: bash
        run: |
          set -euo pipefail
          cd albus-base
          python3 scripts/run-current-kernel-builder.py scripts/build.sh             2>&1 | tee "$GITHUB_WORKSPACE/albus-base-build.log"

      - name: Verify pinned base
        shell: bash
        run: |
          set -euo pipefail
          BASE="albus-base/artifacts/recovery.img"
          INFO="albus-base/artifacts/build-info.txt"
          test -s "$BASE"
          test -s "$INFO"
          [ "$(dd if="$BASE" bs=1 count=8 status=none)" = "ANDROID!" ]
          grep -Fqx "kernel_commit=$ALBUS_KERNEL_COMMIT" "$INFO"
          grep -Fqx "twrp_base=$ALBUS_TWRP_FILE" "$INFO"
          grep -Fqx "twrp_base_sha256=$ALBUS_TWRP_SHA256" "$INFO"
          SIZE=$(stat -c '%s' "$BASE")
          [ "$SIZE" -le "$ALBUS_RECOVERY_LIMIT" ]
          sha256sum "$BASE"
          cat "$INFO"

      - name: Upload reusable known-good base
        uses: actions/upload-artifact@v4
        with:
          name: albus-known-good-base-${{ github.run_id }}
          path: |
            albus-base/artifacts/recovery.img
            albus-base/artifacts/Image.gz
            albus-base/artifacts/dt.img
            albus-base/artifacts/kernel.config
            albus-base/artifacts/build-info.txt
            albus-base/artifacts/SHA256SUMS
            albus-base-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build:
    name: Albus permanent - ${{ matrix.orientation }}
    needs: [prepare, base]
    runs-on: ubuntu-latest
    environment: "gofile keys"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout Albus recovery builder
        uses: actions/checkout@v4
        with:
          ref: Albus-Recovery-Image-Builder
          path: builder-tools

      - name: Checkout Albus binary profile
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          path: console-src

      - name: Download known-good base
        uses: actions/download-artifact@v4
        with:
          name: albus-known-good-base-${{ github.run_id }}
          path: base-artifact

      - name: Install console build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file unzip cpio xxd xz-utils lz4

      - name: Download aarch64 musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 30             -o aarch64-linux-musl-cross.tar.gz             "https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers/aarch64-linux-musl-cross.tar.gz"
          tar -xzf aarch64-linux-musl-cross.tar.gz
          "$HOME/toolchains/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc" --version

      - name: Select Albus orientation
        shell: bash
        run: |
          set -euo pipefail
          python3 builder-tools/builder/set-albus-rotation.py             console-src/include/config.h             '${{ matrix.rotation }}'
          grep -E '^#define[[:space:]]+(ALBUS_ROTATION|ROTATION)[[:space:]]+' console-src/include/config.h

      - name: Build FreeType
        shell: bash
        run: |
          set -euo pipefail
          chmod +x builder-tools/builder/build-freetype.sh
          builder-tools/builder/build-freetype.sh aarch64-linux-musl "$GITHUB_WORKSPACE/console-src"

      - name: Build Albus Recovery Console
        shell: bash
        run: |
          set -euo pipefail
          cd console-src
          make clean
          make aarch64 V=1
          BIN=output/recovery-console-aarch64
          test -s "$BIN"
          chmod 0755 "$BIN"
          file "$BIN"
          if readelf -l "$BIN" | grep -q 'Requesting program interpreter'; then
            echo "ERROR: recovery-console must be static" >&2
            exit 1
          fi
          sha256sum "$BIN"

      - name: Install pinned magiskboot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 --retry-delay 2             -o "tools/Magisk-v$MAGISK_VERSION.apk"             "https://github.com/topjohnwu/Magisk/releases/download/v$MAGISK_VERSION/Magisk-v$MAGISK_VERSION.apk"
          echo "$MAGISK_APK_SHA256  tools/Magisk-v$MAGISK_VERSION.apk" | sha256sum -c -
          unzip -p "tools/Magisk-v$MAGISK_VERSION.apk"             lib/x86_64/libmagiskboot.so > tools/magiskboot
          chmod 0755 tools/magiskboot
          echo "$MAGISKBOOT_SHA256  tools/magiskboot" | sha256sum -c -

      - name: Integrate upstream permanent Recovery Console
        shell: bash
        run: |
          set -euo pipefail
          BASE="base-artifact/albus-base/artifacts/recovery.img"
          OUTDIR="dist"
          OUT="$OUTDIR/recovery-albus-console-upstream-permanent-${{ matrix.orientation }}.img"
          mkdir -p "$OUTDIR"
          chmod +x builder-tools/builder/integrate-recovery.sh

          builder-tools/builder/integrate-recovery.sh             tools/magiskboot             "$BASE"             console-src/output/recovery-console-aarch64             "$OUT"             'u:r:recovery:s0'

          test -s "$OUT"
          [ "$(dd if="$OUT" bs=1 count=8 status=none)" = "ANDROID!" ]
          SIZE=$(stat -c '%s' "$OUT")
          [ "$SIZE" -le "$ALBUS_RECOVERY_LIMIT" ]

      - name: Prove kernel and DT stayed identical
        shell: bash
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/base-artifact/albus-base/artifacts/recovery.img"
          FINAL="$GITHUB_WORKSPACE/dist/recovery-albus-console-upstream-permanent-${{ matrix.orientation }}.img"
          mkdir -p verify/base verify/final
          ( cd verify/base; "$GITHUB_WORKSPACE/tools/magiskboot" unpack -n "$BASE" >/dev/null )
          ( cd verify/final; "$GITHUB_WORKSPACE/tools/magiskboot" unpack -n "$FINAL" >/dev/null )
          cmp -s verify/base/kernel verify/final/kernel || {
            echo "ERROR: kernel changed" >&2
            exit 1
          }
          if [ -f verify/base/extra ] || [ -f verify/final/extra ]; then
            test -f verify/base/extra
            test -f verify/final/extra
            cmp -s verify/base/extra verify/final/extra || {
              echo "ERROR: DT/extra changed" >&2
              exit 1
            }
          fi
          echo "Kernel unchanged"
          echo "DT/extra unchanged"

      - name: Prepare Albus artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/recovery-albus-console-upstream-permanent-${{ matrix.orientation }}.img"
          cp console-src/output/recovery-console-aarch64             "dist/recovery-console-albus-aarch64-${{ matrix.orientation }}"
          cp base-artifact/albus-base/artifacts/build-info.txt dist/KNOWN-GOOD-BASE.txt
          cat > "dist/BUILD-INFO-${{ matrix.orientation }}.txt" <<EOF
          Device: Motorola Moto Z2 Play (albus)
          Branch: Albus-Recovery-Image-Builder
          Source profile: Albus-Configs
          Artifact type: recovery.img
          Known-good builder snapshot: $ALBUS_BASE_BUILDER_COMMIT
          Kernel commit: $ALBUS_KERNEL_COMMIT
          TWRP base: $ALBUS_TWRP_FILE
          TWRP SHA-256: $ALBUS_TWRP_SHA256
          Architecture: aarch64
          Orientation: ${{ matrix.orientation }}
          ROTATION=${{ matrix.rotation }}
          Console path: /system/bin/recovery-console
          Integration: upstream README permanent init.rc method
          Stock recovery service: disabled
          Recovery Console autostart: YES
          Ramdisk compression: LZMA preserved
          Kernel changed by integration: NO
          DT changed by integration: NO
          EOF
          sha256sum "$OUT" > "$OUT.sha256"
          sha256sum "dist/recovery-console-albus-aarch64-${{ matrix.orientation }}"             > "dist/recovery-console-albus-aarch64-${{ matrix.orientation }}.sha256"

      - name: Upload flashable Albus recovery
        uses: actions/upload-artifact@v4
        with:
          name: albus-recovery-console-upstream-permanent-${{ matrix.orientation }}
          path: |
            dist/*.img
            dist/*.img.sha256
            dist/recovery-console-albus-aarch64-*
            dist/recovery-console-albus-aarch64-*.sha256
            dist/BUILD-INFO-*.txt
            dist/KNOWN-GOOD-BASE.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload individual files to GoFile
        shell: bash
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN || secrets.GOFILE_API_TOKEN || secrets.GOFILE_API_KEY || secrets.GOFILE_API || secrets.GOFILE_KEY || secrets.GOFILE || secrets.API_GOFILE || vars.GOFILE_TOKEN || vars.GOFILE_API_TOKEN || vars.GOFILE_API_KEY || vars.GOFILE_API || vars.GOFILE_KEY || vars.GOFILE || vars.API_GOFILE }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID || vars.GOFILE_FOLDER_ID }}
          GOFILE_SOURCE: dist
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::error::GoFile token not found. Supported names: GOFILE_TOKEN, GOFILE_API_TOKEN, GOFILE_API_KEY, GOFILE_API, GOFILE_KEY, GOFILE or API_GOFILE."
            exit 1
          fi
          test -d "$GOFILE_SOURCE"
          folder_id="${GOFILE_FOLDER_ID:-}"
          folder_page=""
          uploaded=0
          summary="$RUNNER_TEMP/gofile-files.md"
          : > "$summary"
          while IFS= read -r -d '' file; do
            args=(--silent --show-error --fail-with-body --retry 4 --retry-delay 2 --retry-all-errors
              -H "Authorization: Bearer $GOFILE_TOKEN"
              -F "file=@$file")
            if [ -n "$folder_id" ]; then
              args+=(-F "folderId=$folder_id")
            fi
            response="$(curl "${args[@]}" https://upload.gofile.io/uploadfile)"
            mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder","")); print(d.get("downloadPage","")); print(d.get("parentFolderCode",""))')
            status="${meta[0]:-}"
            parent="${meta[1]:-}"
            page="${meta[2]:-}"
            parent_code="${meta[3]:-}"
            if [ "$status" != "ok" ]; then
              echo "::error::GoFile rejected $(basename "$file")"
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if [ -z "$folder_id" ]; then folder_id="$parent"; fi
            if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
            name="$(basename "$file")"
            if [ -n "$page" ]; then
              printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"
            else
              printf -- '- %s\n' "$name" >> "$summary"
            fi
            uploaded=$((uploaded + 1))
          done < <(find "$GOFILE_SOURCE" -type f -print0 | sort -z)
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No files found in $GOFILE_SOURCE for GoFile upload"
            exit 1
          fi
          {
            echo "### GoFile — $uploaded individual files"
            [ -z "$folder_page" ] || echo "Folder: $folder_page"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
