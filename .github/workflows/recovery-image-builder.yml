name: Channel Recovery-as-Boot Builder

on:
  push:
    branches: ["Channel-Recovery-Image-Builder"]
    paths:
      - "builder/REQUEST.env"

permissions:
  contents: read

jobs:
  build:
    name: Channel ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotation: 0
            degrees: 0deg
            name: rot0-0deg
          - rotation: 1
            degrees: 90deg
            name: rot1-90deg
          - rotation: 2
            degrees: 180deg
            name: rot2-180deg
          - rotation: 3
            degrees: 270deg
            name: rot3-270deg

    steps:
      - name: Checkout Channel builder
        uses: actions/checkout@v4

      - name: Read request
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          [ -f builder/REQUEST.env ] || { echo "builder/REQUEST.env not found" >&2; exit 1; }
          set -a
          source builder/REQUEST.env
          set +a

          : "${SOURCE_REF:=Channel-Configs}"
          : "${ARCHITECTURE:=aarch64}"
          : "${OUTPUT_PREFIX:=channel-recovery-console}"
          : "${SECLABEL:=u:r:recovery:s0}"
          : "${TWRP_ZIP_URL:=}"
          : "${TWRP_ZIP_PATH:=}"
          : "${TWRP_ZIP_SHA256:=}"
          : "${MAGISK_APK_URL:=}"

          [ "$SOURCE_REF" = "Channel-Configs" ] || {
            echo "ERROR: this builder is dedicated to SOURCE_REF=Channel-Configs" >&2
            exit 1
          }
          [ "$ARCHITECTURE" = "aarch64" ] || {
            echo "ERROR: Channel requires ARCHITECTURE=aarch64" >&2
            exit 1
          }

          if [ -z "$TWRP_ZIP_URL" ] && [ -z "$TWRP_ZIP_PATH" ]; then
            echo "Either TWRP_ZIP_URL or TWRP_ZIP_PATH is required" >&2
            exit 1
          fi
          if [ -n "$TWRP_ZIP_URL" ] && [ -n "$TWRP_ZIP_PATH" ]; then
            echo "Use only one of TWRP_ZIP_URL or TWRP_ZIP_PATH" >&2
            exit 1
          fi

          {
            echo "source_ref=$SOURCE_REF"
            echo "twrp_zip_url=$TWRP_ZIP_URL"
            echo "twrp_zip_path=$TWRP_ZIP_PATH"
            echo "twrp_zip_sha256=$TWRP_ZIP_SHA256"
            echo "architecture=$ARCHITECTURE"
            echo "output_prefix=$OUTPUT_PREFIX"
            echo "seclabel=$SECLABEL"
            echo "magisk_apk_url=$MAGISK_APK_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Channel profile
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.source_ref }}
          path: console-src

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget unzip zip jq cpio file xxd xz-utils lz4

      - name: Download aarch64 toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          URL="https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers/aarch64-linux-musl-cross.tar.gz"
          curl -fL --retry 3 --retry-delay 2 -o toolchain.tar.gz "$URL"
          tar -xzf toolchain.tar.gz
          test -x "$HOME/toolchains/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc"

      - name: Patch Channel rotation
        run: |
          python3 builder/set-rotation.py console-src/include/config.h '${{ matrix.rotation }}'
          grep -E '^#define[[:space:]]+ROTATION[[:space:]]+' console-src/include/config.h

      - name: Build FreeType
        run: |
          chmod +x builder/build-freetype.sh
          builder/build-freetype.sh aarch64-linux-musl "$GITHUB_WORKSPACE/console-src"

      - name: Build Recovery Console
        shell: bash
        run: |
          set -euo pipefail
          cd console-src
          make clean
          make aarch64 V=1
          test -s output/recovery-console-aarch64
          chmod 0755 output/recovery-console-aarch64
          file output/recovery-console-aarch64
          sha256sum output/recovery-console-aarch64

      - name: Prepare Channel TWRP installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          URL='${{ steps.cfg.outputs.twrp_zip_url }}'
          PATH_IN='${{ steps.cfg.outputs.twrp_zip_path }}'
          EXPECTED='${{ steps.cfg.outputs.twrp_zip_sha256 }}'

          if [ -n "$URL" ]; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 30 -o input/twrp-channel.zip "$URL"
          else
            test -f "$PATH_IN"
            cp "$PATH_IN" input/twrp-channel.zip
          fi

          test -s input/twrp-channel.zip
          unzip -t input/twrp-channel.zip >/dev/null

          ACTUAL=$(sha256sum input/twrp-channel.zip | awk '{print $1}')
          echo "Base TWRP installer SHA-256: $ACTUAL"
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: TWRP installer SHA-256 mismatch" >&2
            exit 1
          fi

          unzip -l input/twrp-channel.zip | grep -Eq 'ramdisk-(twrp|recovery)\.cpio'
          unzip -l input/twrp-channel.zip | grep -q 'META-INF/com/google/android/update-binary'
          unzip -l input/twrp-channel.zip | grep -q 'magiskboot'

      - name: Install host magiskboot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          MAGISK_URL='${{ steps.cfg.outputs.magisk_apk_url }}'
          if [ -z "$MAGISK_URL" ]; then
            MAGISK_URL=$(curl -fsSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
              | jq -r '.assets[] | select(.name | test("^Magisk-v.*\\.apk$")) | .browser_download_url' \
              | head -n1)
          fi
          [ -n "$MAGISK_URL" ] && [ "$MAGISK_URL" != "null" ]
          curl -fL --retry 3 --retry-delay 2 -o tools/Magisk.apk "$MAGISK_URL"
          unzip -p tools/Magisk.apk lib/x86_64/libmagiskboot.so > tools/magiskboot
          chmod 0755 tools/magiskboot
          test -x tools/magiskboot
          test -s tools/magiskboot

      - name: Integrate Recovery Console into TWRP ramdisk
        shell: bash
        run: |
          set -euo pipefail
          chmod +x builder/integrate-channel-twrp-zip.sh
          mkdir -p dist
          OUT="dist/${{ steps.cfg.outputs.output_prefix }}-aarch64-${{ matrix.name }}.zip"

          builder/integrate-channel-twrp-zip.sh \
            tools/magiskboot \
            input/twrp-channel.zip \
            console-src/output/recovery-console-aarch64 \
            "$OUT" \
            '${{ steps.cfg.outputs.seclabel }}'

          RAMDISK=$(unzip -Z1 "$OUT" | grep -E '^ramdisk-(twrp|recovery)\.cpio$' | head -n1)
          [ -n "$RAMDISK" ]
          unzip -p "$OUT" "$RAMDISK" > "dist/${{ steps.cfg.outputs.output_prefix }}-aarch64-${{ matrix.name }}-$RAMDISK"

          cat > "dist/BUILD-INFO-${{ matrix.name }}.txt" <<EOF
          Device: Moto G7 Play (channel)
          Recovery layout: recovery-as-boot
          Source profile: ${{ steps.cfg.outputs.source_ref }}
          Architecture: aarch64
          ROTATION=${{ matrix.rotation }}
          Orientation=${{ matrix.degrees }} clockwise
          Installer patches: boot_a + boot_b
          Recovery Console autostart: disabled
          SELinux seclabel: ${{ steps.cfg.outputs.seclabel }}
          EOF

          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh dist/

      - name: Upload Channel recovery-as-boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.output_prefix }}-aarch64-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*ramdisk*.cpio
            dist/BUILD-INFO-*.txt
          if-no-files-found: error
          compression-level: 0
