name: Channel Recovery-as-Boot Builder

on:
  push:
    branches: ["Channel-Recovery-Image-Builder"]
    paths:
      - "builder/REQUEST.env"
      - "builder/integrate-channel-twrp-zip.sh"
      - "builder/set-rotation.py"
      - "builder/build-freetype.sh"
      - ".github/workflows/recovery-image-builder.yml"

permissions:
  contents: read

env:
  CHANNEL_TWRP_VERSION: "3.5.2_10-0"
  CHANNEL_TWRP_SHA256: "2c43cee3d2fc64c7632d6f2f49567f59a563446a34b073678eda8b77cb5bd74c"
  MAGISK_VERSION: "30.7"
  MAGISK_APK_SHA256: "e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5"
  MAGISKBOOT_SHA256: "a18ecbd7981179494b7d281453d6c4e25b5c719e7d2ef7f6eba3c6be3043c58e"

jobs:
  prepare:
    name: Read Channel request
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
      source_ref: ${{ steps.cfg.outputs.source_ref }}
      orientation: ${{ steps.cfg.outputs.orientation }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve request
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          test -f builder/REQUEST.env
          set -a
          source builder/REQUEST.env
          set +a

          : "${SOURCE_REF:=Channel-Configs}"
          : "${ORIENTATION:=all}"
          : "${TWRP_VERSION:=3.5.2_10-0}"

          [ "$SOURCE_REF" = "Channel-Configs" ] || {
            echo "ERROR: Channel recovery builder only accepts SOURCE_REF=Channel-Configs" >&2
            exit 1
          }
          [ "$TWRP_VERSION" = "$CHANNEL_TWRP_VERSION" ] || {
            echo "ERROR: only the validated TWRP $CHANNEL_TWRP_VERSION base is accepted" >&2
            exit 1
          }

          case "$ORIENTATION" in
            all)
              MATRIX='{"include":[
                {"rotation":0,"degrees":"0deg","orientation":"portrait-0"},
                {"rotation":1,"degrees":"90deg","orientation":"landscape-90"},
                {"rotation":2,"degrees":"180deg","orientation":"portrait-180"},
                {"rotation":3,"degrees":"270deg","orientation":"landscape-270"}
              ]}'
              ;;
            portrait-0)
              MATRIX='{"include":[{"rotation":0,"degrees":"0deg","orientation":"portrait-0"}]}'
              ;;
            landscape-90)
              MATRIX='{"include":[{"rotation":1,"degrees":"90deg","orientation":"landscape-90"}]}'
              ;;
            portrait-180)
              MATRIX='{"include":[{"rotation":2,"degrees":"180deg","orientation":"portrait-180"}]}'
              ;;
            landscape-270)
              MATRIX='{"include":[{"rotation":3,"degrees":"270deg","orientation":"landscape-270"}]}'
              ;;
            *)
              echo "ERROR: unsupported ORIENTATION=$ORIENTATION" >&2
              exit 1
              ;;
          esac

          MATRIX=$(printf '%s' "$MATRIX" | tr -d '\n' | tr -d ' ')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "orientation=$ORIENTATION" >> "$GITHUB_OUTPUT"
          echo "Request: source=$SOURCE_REF orientation=$ORIENTATION TWRP=$TWRP_VERSION"

  build:
    name: Channel permanent - ${{ matrix.orientation }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout Channel recovery builder
        uses: actions/checkout@v4
        with:
          ref: Channel-Recovery-Image-Builder
          path: builder-tools

      - name: Checkout Channel binary profile
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          path: console-src

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip zip cpio file xxd xz-utils lz4

      - name: Download aarch64 musl toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 30             -o aarch64-linux-musl-cross.tar.gz             "https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers/aarch64-linux-musl-cross.tar.gz"
          tar -xzf aarch64-linux-musl-cross.tar.gz
          "$HOME/toolchains/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc" --version

      - name: Select Channel orientation
        shell: bash
        run: |
          set -euo pipefail
          python3 builder-tools/builder/set-rotation.py             console-src/include/config.h             '${{ matrix.rotation }}'
          grep -E '^#define[[:space:]]+(CHANNEL_ROTATION|ROTATION)[[:space:]]+' console-src/include/config.h

      - name: Build FreeType
        shell: bash
        run: |
          set -euo pipefail
          chmod +x builder-tools/builder/build-freetype.sh
          builder-tools/builder/build-freetype.sh aarch64-linux-musl "$GITHUB_WORKSPACE/console-src"

      - name: Build Channel Recovery Console
        shell: bash
        run: |
          set -euo pipefail
          cd console-src
          make clean
          make aarch64 V=1
          BIN=output/recovery-console-aarch64
          test -s "$BIN"
          chmod 0755 "$BIN"
          file "$BIN"
          if readelf -l "$BIN" | grep -q 'Requesting program interpreter'; then
            echo "ERROR: recovery-console must be static" >&2
            exit 1
          fi
          sha256sum "$BIN"

      - name: Download validated official TeamWin installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          NAME="twrp-installer-$CHANNEL_TWRP_VERSION-channel.zip"
          PAGE="https://dl.twrp.me/channel/$NAME.html"

          PAGE_HTML=$(curl -fLsS --retry 3 --retry-delay 2             -A 'Mozilla/5.0 GitHub-Actions Recovery-Console-Builder' "$PAGE")

          FILE_HREF=$(printf '%s' "$PAGE_HTML"             | grep -oE 'href="[^"]*twrp-installer-[^"]*-channel\.zip"'             | head -n1 | cut -d'"' -f2)

          case "$FILE_HREF" in
            http://*|https://*) FILE_URL="$FILE_HREF" ;;
            /*) FILE_URL="https://dl.twrp.me$FILE_HREF" ;;
            *) FILE_URL="https://dl.twrp.me/channel/$FILE_HREF" ;;
          esac

          ok=0
          for URL in             "https://eu.dl.twrp.me/channel/$NAME"             "$FILE_URL"             "https://dl.twrp.me/channel/$NAME?download=1"; do
            rm -f "input/$NAME.part"
            if curl -fL --retry 3 --retry-delay 2 --connect-timeout 30               -A 'Mozilla/5.0 GitHub-Actions Recovery-Console-Builder'               -e "$PAGE" -o "input/$NAME.part" "$URL" &&
              unzip -t "input/$NAME.part" >/dev/null 2>&1; then
              mv "input/$NAME.part" "input/$NAME"
              ok=1
              break
            fi
          done
          [ "$ok" -eq 1 ]

          echo "$CHANNEL_TWRP_SHA256  input/$NAME" | sha256sum -c -
          unzip -Z1 "input/$NAME" | grep -Eq '^ramdisk-(twrp|recovery)\.cpio$'
          unzip -Z1 "input/$NAME" | grep -q '^META-INF/com/google/android/update-binary$'
          unzip -Z1 "input/$NAME" | grep -q '^magiskboot$'

      - name: Install pinned host magiskboot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -fL --retry 3 --retry-delay 2             -o "tools/Magisk-v$MAGISK_VERSION.apk"             "https://github.com/topjohnwu/Magisk/releases/download/v$MAGISK_VERSION/Magisk-v$MAGISK_VERSION.apk"
          echo "$MAGISK_APK_SHA256  tools/Magisk-v$MAGISK_VERSION.apk" | sha256sum -c -
          unzip -p "tools/Magisk-v$MAGISK_VERSION.apk"             lib/x86_64/libmagiskboot.so > tools/magiskboot
          chmod 0755 tools/magiskboot
          echo "$MAGISKBOOT_SHA256  tools/magiskboot" | sha256sum -c -

      - name: Integrate upstream permanent Recovery Console
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod +x builder-tools/builder/integrate-channel-twrp-zip.sh

          BASE="input/twrp-installer-$CHANNEL_TWRP_VERSION-channel.zip"
          OUT="dist/twrp-$CHANNEL_TWRP_VERSION-channel-recovery-console-upstream-permanent-${{ matrix.orientation }}.zip"

          builder-tools/builder/integrate-channel-twrp-zip.sh             tools/magiskboot             "$BASE"             console-src/output/recovery-console-aarch64             "$OUT"             'u:r:recovery:s0'

          test -s "$OUT"
          unzip -t "$OUT" >/dev/null
          RAMDISK=$(unzip -Z1 "$OUT" | grep -E '^ramdisk-(twrp|recovery)\.cpio$' | head -n1)
          unzip -p "$OUT" "$RAMDISK" > "dist/${{ matrix.orientation }}-$RAMDISK"

          cat > "dist/BUILD-INFO-${{ matrix.orientation }}.txt" <<EOF
          Device: Motorola Moto G7 Play (channel)
          Branch: Channel-Recovery-Image-Builder
          Source profile: Channel-Configs
          Artifact type: native TWRP recovery-as-boot installer
          TWRP base: twrp-installer-$CHANNEL_TWRP_VERSION-channel.zip
          TWRP SHA-256: $CHANNEL_TWRP_SHA256
          Architecture: aarch64
          Orientation: ${{ matrix.orientation }}
          ROTATION=${{ matrix.rotation }}
          Physical display: 720x1512
          Framebuffer: /dev/graphics/fb0
          Recovery layout: recovery-as-boot
          Installer target: boot_a + boot_b
          Installer update-binary: preserved
          Console path: /system/bin/recovery-console
          Integration: upstream README permanent init.rc method
          Stock recovery service: disabled
          Recovery Console autostart: YES
          SELinux recovery mode: permissive from TWRP early-init
          Fallback on console shell exit: start recovery
          EOF

          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload flashable Channel installer
        uses: actions/upload-artifact@v4
        with:
          name: channel-twrp-console-upstream-permanent-${{ matrix.orientation }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*ramdisk*.cpio
            dist/BUILD-INFO-*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload individual files to GoFile
        shell: bash
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN || secrets.GOFILE_API_TOKEN || secrets.GOFILE_API_KEY || secrets.GOFILE_API || secrets.GOFILE_KEY || secrets.GOFILE || secrets.API_GOFILE || vars.GOFILE_TOKEN || vars.GOFILE_API_TOKEN || vars.GOFILE_API_KEY || vars.GOFILE_API || vars.GOFILE_KEY || vars.GOFILE || vars.API_GOFILE }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID || vars.GOFILE_FOLDER_ID }}
          GOFILE_SOURCE: dist
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::error::GoFile token not found. Supported names: GOFILE_TOKEN, GOFILE_API_TOKEN, GOFILE_API_KEY, GOFILE_API, GOFILE_KEY, GOFILE or API_GOFILE."
            exit 1
          fi
          test -d "$GOFILE_SOURCE"
          folder_id="${GOFILE_FOLDER_ID:-}"
          folder_page=""
          uploaded=0
          summary="$RUNNER_TEMP/gofile-files.md"
          : > "$summary"
          while IFS= read -r -d '' file; do
            args=(--silent --show-error --fail-with-body --retry 4 --retry-delay 2 --retry-all-errors
              -H "Authorization: Bearer $GOFILE_TOKEN"
              -F "file=@$file")
            if [ -n "$folder_id" ]; then
              args+=(-F "folderId=$folder_id")
            fi
            response="$(curl "${args[@]}" https://upload.gofile.io/uploadfile)"
            mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder","")); print(d.get("downloadPage","")); print(d.get("parentFolderCode",""))')
            status="${meta[0]:-}"
            parent="${meta[1]:-}"
            page="${meta[2]:-}"
            parent_code="${meta[3]:-}"
            if [ "$status" != "ok" ]; then
              echo "::error::GoFile rejected $(basename "$file")"
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if [ -z "$folder_id" ]; then folder_id="$parent"; fi
            if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
            name="$(basename "$file")"
            if [ -n "$page" ]; then
              printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"
            else
              printf -- '- %s\n' "$name" >> "$summary"
            fi
            uploaded=$((uploaded + 1))
          done < <(find "$GOFILE_SOURCE" -type f -print0 | sort -z)
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No files found in $GOFILE_SOURCE for GoFile upload"
            exit 1
          fi
          {
            echo "### GoFile — $uploaded individual files"
            [ -z "$folder_page" ] || echo "Folder: $folder_page"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
