name: Recovery Image Builder

on:
  push:
    branches: ["Recovery-Image-Builder"]
    paths:
      - "builder/REQUEST.env"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: "gofile keys"
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotation: 0
            degrees: 0deg
            name: rot0-0deg
          - rotation: 1
            degrees: 90deg
            name: rot1-90deg
          - rotation: 2
            degrees: 180deg
            name: rot2-180deg
          - rotation: 3
            degrees: 270deg
            name: rot3-270deg

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Read request
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          [ -f builder/REQUEST.env ] || { echo "builder/REQUEST.env not found" >&2; exit 1; }
          set -a
          source builder/REQUEST.env
          set +a

          : "${SOURCE_REF:?SOURCE_REF is required}"
          : "${ARCHITECTURE:?ARCHITECTURE is required}"
          : "${OUTPUT_PREFIX:=recovery-console}"
          : "${SECLABEL:=u:r:recovery:s0}"
          : "${RECOVERY_URL:=}"
          : "${RECOVERY_PATH:=}"
          : "${RECOVERY_SHA256:=}"
          : "${MAGISK_APK_URL:=}"

          if [ -z "$RECOVERY_URL" ] && [ -z "$RECOVERY_PATH" ]; then
            echo "Either RECOVERY_URL or RECOVERY_PATH is required" >&2
            exit 1
          fi
          if [ -n "$RECOVERY_URL" ] && [ -n "$RECOVERY_PATH" ]; then
            echo "Use only one of RECOVERY_URL or RECOVERY_PATH" >&2
            exit 1
          fi

          case "$ARCHITECTURE" in
            aarch64) TRIPLE=aarch64-linux-musl ;;
            armhf)   TRIPLE=arm-linux-musleabihf ;;
            x86_64)  TRIPLE=x86_64-linux-musl ;;
            x86)     TRIPLE=i686-linux-musl ;;
            *) echo "Unsupported ARCHITECTURE=$ARCHITECTURE" >&2; exit 1 ;;
          esac

          {
            echo "source_ref=$SOURCE_REF"
            echo "recovery_url=$RECOVERY_URL"
            echo "recovery_path=$RECOVERY_PATH"
            echo "recovery_sha256=$RECOVERY_SHA256"
            echo "architecture=$ARCHITECTURE"
            echo "triple=$TRIPLE"
            echo "output_prefix=$OUTPUT_PREFIX"
            echo "seclabel=$SECLABEL"
            echo "magisk_apk_url=$MAGISK_APK_URL"
          } >> "$GITHUB_OUTPUT"

          echo "Source ref   : $SOURCE_REF"
          echo "Architecture : $ARCHITECTURE"
          echo "Recovery URL : ${RECOVERY_URL:-<not used>}"
          echo "Recovery path: ${RECOVERY_PATH:-<not used>}"
          echo "Rotation     : ${{ matrix.rotation }} (${{ matrix.degrees }})"

      - name: Checkout device source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.source_ref }}
          path: console-src

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget unzip jq cpio file xxd xz-utils lz4

      - name: Download target toolchain
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE='${{ steps.cfg.outputs.triple }}'
          mkdir -p "$HOME/toolchains"
          cd "$HOME/toolchains"
          URL="https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers/${TRIPLE}-cross.tar.gz"
          curl -fL --retry 3 --retry-delay 2 -o toolchain.tar.gz "$URL"
          tar -xzf toolchain.tar.gz
          test -x "$HOME/toolchains/${TRIPLE}-cross/bin/${TRIPLE}-gcc"

      - name: Patch requested rotation
        run: |
          python3 builder/set-rotation.py console-src/include/config.h '${{ matrix.rotation }}'
          grep -E '^#define[[:space:]]+ROTATION[[:space:]]+' console-src/include/config.h

      - name: Build FreeType
        run: |
          chmod +x builder/build-freetype.sh
          builder/build-freetype.sh '${{ steps.cfg.outputs.triple }}' "$GITHUB_WORKSPACE/console-src"

      - name: Build Recovery Console
        shell: bash
        run: |
          set -euo pipefail
          cd console-src
          make clean
          make '${{ steps.cfg.outputs.architecture }}' V=1
          BIN="output/recovery-console-${{ steps.cfg.outputs.architecture }}"
          test -s "$BIN"
          chmod 0755 "$BIN"
          file "$BIN"
          sha256sum "$BIN"

      - name: Prepare base recovery image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          URL='${{ steps.cfg.outputs.recovery_url }}'
          PATH_IN='${{ steps.cfg.outputs.recovery_path }}'
          EXPECTED='${{ steps.cfg.outputs.recovery_sha256 }}'

          if [ -n "$URL" ]; then
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 30 \
              -o input/recovery.img "$URL"
          else
            test -f "$PATH_IN"
            cp "$PATH_IN" input/recovery.img
          fi

          test -s input/recovery.img
          file input/recovery.img || true
          ACTUAL=$(sha256sum input/recovery.img | awk '{print $1}')
          echo "Base recovery SHA-256: $ACTUAL"
          if [ -n "$EXPECTED" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: base recovery SHA-256 mismatch" >&2
            exit 1
          fi

      - name: Install magiskboot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          MAGISK_URL='${{ steps.cfg.outputs.magisk_apk_url }}'
          if [ -z "$MAGISK_URL" ]; then
            MAGISK_URL=$(curl -fsSL https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
              | jq -r '.assets[] | select(.name | test("^Magisk-v.*\\.apk$")) | .browser_download_url' \
              | head -n1)
          fi
          [ -n "$MAGISK_URL" ] && [ "$MAGISK_URL" != "null" ]
          echo "Magisk APK: $MAGISK_URL"
          curl -fL --retry 3 --retry-delay 2 -o tools/Magisk.apk "$MAGISK_URL"
          unzip -p tools/Magisk.apk lib/x86_64/libmagiskboot.so > tools/magiskboot
          chmod 0755 tools/magiskboot
          test -x tools/magiskboot
          test -s tools/magiskboot

      - name: Integrate Recovery Console into recovery image
        shell: bash
        run: |
          set -euo pipefail
          chmod +x builder/integrate-recovery.sh
          mkdir -p dist
          OUT="dist/${{ steps.cfg.outputs.output_prefix }}-${{ steps.cfg.outputs.architecture }}-${{ matrix.name }}.img"
          builder/integrate-recovery.sh \
            tools/magiskboot \
            input/recovery.img \
            "console-src/output/recovery-console-${{ steps.cfg.outputs.architecture }}" \
            "$OUT" \
            '${{ steps.cfg.outputs.seclabel }}'

          cat > "dist/BUILD-INFO-${{ matrix.name }}.txt" <<EOF
          Recovery Console source ref: ${{ steps.cfg.outputs.source_ref }}
          Architecture: ${{ steps.cfg.outputs.architecture }}
          ROTATION=${{ matrix.rotation }}
          Orientation=${{ matrix.degrees }} clockwise
          Base recovery URL: ${{ steps.cfg.outputs.recovery_url }}
          Base recovery path: ${{ steps.cfg.outputs.recovery_path }}
          Service autostart: disabled
          SELinux seclabel: ${{ steps.cfg.outputs.seclabel }}
          EOF

          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh dist/

      - name: Upload integrated recovery image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.output_prefix }}-${{ steps.cfg.outputs.architecture }}-${{ matrix.name }}
          path: |
            dist/*.img
            dist/*.sha256
            dist/BUILD-INFO-*.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload individual files to GoFile
        shell: bash
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN || secrets.GOFILE_API_TOKEN || secrets.GOFILE_API_KEY || secrets.GOFILE_API || secrets.GOFILE_KEY || secrets.GOFILE || secrets.API_GOFILE || vars.GOFILE_TOKEN || vars.GOFILE_API_TOKEN || vars.GOFILE_API_KEY || vars.GOFILE_API || vars.GOFILE_KEY || vars.GOFILE || vars.API_GOFILE }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID || vars.GOFILE_FOLDER_ID }}
          GOFILE_SOURCE: dist
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::error::GoFile token not found. Supported names: GOFILE_TOKEN, GOFILE_API_TOKEN, GOFILE_API_KEY, GOFILE_API, GOFILE_KEY, GOFILE or API_GOFILE."
            exit 1
          fi
          test -d "$GOFILE_SOURCE"
          folder_id="${GOFILE_FOLDER_ID:-}"
          folder_page=""
          uploaded=0
          summary="$RUNNER_TEMP/gofile-files.md"
          : > "$summary"
          while IFS= read -r -d '' file; do
            args=(--silent --show-error --fail-with-body --retry 4 --retry-delay 2 --retry-all-errors
              -H "Authorization: Bearer $GOFILE_TOKEN"
              -F "file=@$file")
            if [ -n "$folder_id" ]; then
              args+=(-F "folderId=$folder_id")
            fi
            response="$(curl "${args[@]}" https://upload.gofile.io/uploadfile)"
            mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder","")); print(d.get("downloadPage","")); print(d.get("parentFolderCode",""))')
            status="${meta[0]:-}"
            parent="${meta[1]:-}"
            page="${meta[2]:-}"
            parent_code="${meta[3]:-}"
            if [ "$status" != "ok" ]; then
              echo "::error::GoFile rejected $(basename "$file")"
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if [ -z "$folder_id" ]; then folder_id="$parent"; fi
            if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
            name="$(basename "$file")"
            if [ -n "$page" ]; then
              printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"
            else
              printf -- '- %s\n' "$name" >> "$summary"
            fi
            uploaded=$((uploaded + 1))
          done < <(find "$GOFILE_SOURCE" -type f -print0 | sort -z)
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::No files found in $GOFILE_SOURCE for GoFile upload"
            exit 1
          fi
          {
            echo "### GoFile — $uploaded individual files"
            [ -z "$folder_page" ] || echo "Folder: $folder_page"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
